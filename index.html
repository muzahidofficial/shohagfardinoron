    /* Premium glitch treatment */
    .error-page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .09;
      mix-blend-mode: screen;
      background:
        repeating-linear-gradient(
          to bottom,

          rgba(255,255,255,.22) 1px,
          transparent 2px,
          transparent 5px
        );
      animation: scanlineDrift 7s linear infinite;
    }

    .error-page::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 21;
      opacity: .12;
      background:
        linear-gradient(90deg, transparent 0%, rgba(177,132,76,.12) 48%, rgba(216,183,132,.12) 52%, transparent 100%);
      transform: translateX(-120%);
      animation: glitchSweep 5.8s ease-in-out infinite;
    }

    .big-404 {
      position: absolute;
      isolation: isolate;
      animation: numberGlitchPulse 4.8s steps(1, end) infinite;
    }

    .big-404::before,
    .big-404::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: transparent;
      background: inherit;
      -webkit-background-clip: text;
      background-clip: text;
      pointer-events: none;
      opacity: .50;
      mix-blend-mode: screen;
    }

    .big-404::before {
      transform: translate(-6px, 0);
      filter: drop-shadow(8px 0 0 rgba(177,132,76,.30));
      clip-path: inset(10% 0 58% 0);
      animation: glitchSliceOne 2.8s steps(1, end) infinite;
    }

    .big-404::after {
      transform: translate(5px, 0);
      filter: drop-shadow(-8px 0 0 rgba(216,183,132,.28));
      clip-path: inset(58% 0 12% 0);
      animation: glitchSliceTwo 3.4s steps(1, end) infinite;
    }

    .glitch-title {
      position: relative;
      display: inline-block;
      isolation: isolate;
      animation: titleMicroJitter 5.2s steps(1, end) infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
    }

    .glitch-title::before {
      color: rgba(177,132,76,.75);
      transform: translate(-2px, 0);
      clip-path: inset(0 0 58% 0);
      animation: titleGlitchBlue 3.6s steps(1, end) infinite;
    }

    .glitch-title::after {
      color: rgba(216,183,132,.70);
      transform: translate(2px, 0);
      clip-path: inset(54% 0 0 0);

    @keyframes scanlineDrift {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(8px); }
    }

    @keyframes glitchSweep {
      0%, 76%, 100% { transform: translateX(-120%); opacity: 0; }
      78% { transform: translateX(-40%); opacity: .14; }
      80% { transform: translateX(110%); opacity: .05; }
    }

    @keyframes numberGlitchPulse {
      0%, 89%, 100% { transform: translate(-50%, -50%); filter: none; }
      90% { transform: translate(calc(-50% - 3px), calc(-50% + 1px)); filter: saturate(1.35) contrast(1.1); }
      91% { transform: translate(calc(-50% + 4px), calc(-50% - 2px)); }
      92% { transform: translate(-50%, -50%); }
      96% { filter: brightness(1.18); }
    }

    @keyframes glitchSliceOne {
      0%, 84%, 100% { opacity: 0; transform: translate(0, 0); clip-path: inset(10% 0 58% 0); }
      85% { opacity: .62; transform: translate(-10px, -2px); clip-path: inset(16% 0 64% 0); }
      86% { opacity: .30; transform: translate(7px, 1px); clip-path: inset(35% 0 42% 0); }
      87% { opacity: 0; transform: translate(0, 0); }
    }

    @keyframes glitchSliceTwo {
      0%, 70%, 100% { opacity: 0; transform: translate(0, 0); clip-path: inset(58% 0 12% 0); }
      71% { opacity: .55; transform: translate(9px, 2px); clip-path: inset(62% 0 18% 0); }
      72% { opacity: .26; transform: translate(-6px, -1px); clip-path: inset(45% 0 35% 0); }
      73% { opacity: 0; transform: translate(0, 0); }
    }

    @keyframes titleMicroJitter {
      0%, 92%, 100% { transform: translate(0,0); }
      93% { transform: translate(-1px, 1px); }
      94% { transform: translate(2px, -1px); }
      95% { transform: translate(0,0); }
